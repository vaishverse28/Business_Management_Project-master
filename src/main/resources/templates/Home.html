<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        /* Custom Header Bar Style */
        .navbar {
            background-color: #2b2b2b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            height: 60px;
        }
        .navbar .logo img {
            height: 45px;
            width: 45px;
            border-radius: 50%;
            object-fit: cover;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 40px;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .nav-links a:hover {
            color: #4CAF50;
        }
        /* Video Banner Style */
        .video-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 60px);
            overflow: hidden;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .banner-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ffffff;
            width: 90%;
        }
        .banner-text h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        }
        .banner-text p {
            font-size: 1.3rem;
            margin-bottom: 8px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <!-- BLACK NAVIGATION BAR -->
    <div class="navbar">
        <div class="logo">
            <img src="/images/logo-v.png" th:src="@{/images/logo-v.png}" alt="Logo" onerror="this.style.display='none'">
        </div>
        <ul class="nav-links">
            <li><a href="/home">Home</a></li>
            <li><a href="/products">Products</a></li>
            <li><a href="/locate">Locate_Us 🎯</a></li>
            <li><a href="/about">About_Us</a></li>
            <li><a href="/login">Log_In 📲</a></li>
        </ul>
    </div>

    <!-- BACKGROUND VIDEO BANNER -->
    <div class="video-container">
        <video autoplay loop muted playsinline>
            <source src="/videos/teaTree.mp4" th:src="@{/videos/teaTree.mp4}" type="video/mp4">
        </video>
        <div class="banner-text">
            <h1>SPECIAL TEA BARAMATI</h1>
            <p style="color: #63E6be; font-weight: bold;">Where Quality Meets Innovation!</p>
            <p>Explore our wide range of products designed to enhance your life.</p>
        </div>
    </div>

</body>
</html>
